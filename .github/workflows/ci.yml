name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  compatibility:
    uses: Daniel-Astrofer/.github/.github/workflows/compatibility-ci.yml@2552ff2125c2d72accebe93804b8e139a52ded13
    with:
      component: core

  java:
    uses: Daniel-Astrofer/.github/.github/workflows/java-ci.yml@2552ff2125c2d72accebe93804b8e139a52ded13
    with:
      gradle-arguments: test

  jctl:
    uses: Daniel-Astrofer/.github/.github/workflows/admin-cli-ci.yml@22187a79ff528ae7c31b9b13ec6903c11807f9a9
    with:
      language: java
      package: kerosene-jctl

  security:
    uses: Daniel-Astrofer/.github/.github/workflows/security-scan.yml@2552ff2125c2d72accebe93804b8e139a52ded13
