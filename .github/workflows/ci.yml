name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  compatibility:
    uses: Daniel-Astrofer/.github/.github/workflows/compatibility-ci.yml@13ca0b7eb3992aab286019e398f1fc7dbaee8f8a
    with:
      component: core

  java:
    uses: Daniel-Astrofer/.github/.github/workflows/java-ci.yml@13ca0b7eb3992aab286019e398f1fc7dbaee8f8a
    with:
      gradle-arguments: test

  security:
    uses: Daniel-Astrofer/.github/.github/workflows/security-scan.yml@13ca0b7eb3992aab286019e398f1fc7dbaee8f8a
